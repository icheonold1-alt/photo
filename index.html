<!DOCTYPE html>
<html lang="ko">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- JSZip & FileSaver -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-10">

  <!-- Toast Notification -->
  <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900/90 text-white text-xs px-4 py-2.5 rounded-full shadow-lg flex items-center gap-2 transition-all duration-300 opacity-0 pointer-events-none">
    <i id="toast-icon" class="fa-solid fa-spinner fa-spin text-emerald-400"></i>
    <span id="toast-msg">처리 중...</span>
  </div>

  <!-- Header -->
  <header class="bg-indigo-700 text-white sticky top-0 z-30 shadow-md">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <h1 class="font-bold text-lg flex items-center gap-2">
          <i class="fa-solid fa-camera"></i> 장수대학 수업사진 관리
        </h1>
        <div class="flex items-center gap-2 mt-0.5">
          <span class="text-xs text-indigo-200 font-bold" id="current-week-badge">주차 계산 중...</span>
          <span class="bg-emerald-500/30 border border-emerald-400/50 text-emerald-200 text-[10px] px-1.5 py-0.2 rounded font-semibold flex items-center gap-1">
            <i class="fa-solid fa-users"></i> 주간 동기화
          </span>
        </div>
      </div>
      
      <!-- Menu Button -->
      <button id="open-menu-btn" class="bg-indigo-800 hover:bg-indigo-900 border border-indigo-500 text-white text-xs font-bold px-3 py-1.5 rounded-xl flex items-center gap-1.5 transition">
        <i class="fa-solid fa-bars"></i> 메뉴
      </button>
    </div>

    <!-- Archive Banner -->
    <div id="archive-banner" class="bg-amber-500 text-slate-900 px-4 py-1.5 text-xs font-bold text-center hidden flex items-center justify-center gap-2">
      <i class="fa-solid fa-box-archive"></i>
      <span id="archive-banner-text">[보관함]을 조회 중입니다.</span>
      <button onclick="exitArchiveView()" class="ml-2 bg-amber-700 text-white text-[10px] px-2 py-0.5 rounded-md hover:bg-amber-800">이번 주로 돌아가기</button>
    </div>

    <!-- Progress Bar -->
    <div id="progress-container" class="max-w-md mx-auto px-4 pb-3 pt-1">
      <div class="flex justify-between text-xs font-semibold mb-1">
        <span id="progress-text">필수 촬영: 0 / 69 (0%)</span>
        <span id="warning-count-badge" class="text-[10px] bg-rose-500 text-white px-1.5 py-0.2 rounded font-bold">이번 달 0회 미달선 0개</span>
      </div>
      <div class="w-full bg-indigo-900 rounded-full h-2 overflow-hidden">
        <div id="progress-bar" class="bg-emerald-400 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
      </div>
    </div>

    <!-- Day Filter Tabs -->
    <div class="max-w-md mx-auto px-4 flex gap-2 overflow-x-auto hide-scrollbar pb-3">
      <button class="day-tab active-tab bg-white text-indigo-700 font-bold px-4 py-1.5 rounded-full text-xs shadow shrink-0" data-day="전체">전체</button>
      <button class="day-tab bg-indigo-600/70 text-white font-medium px-4 py-1.5 rounded-full text-xs shrink-0" data-day="월">월요일</button>
      <button class="day-tab bg-indigo-600/70 text-white font-medium px-4 py-1.5 rounded-full text-xs shrink-0" data-day="화">화요일</button>
      <button class="day-tab bg-indigo-600/70 text-white font-medium px-4 py-1.5 rounded-full text-xs shrink-0" data-day="수">수요일</button>
      <button class="day-tab bg-indigo-600/70 text-white font-medium px-4 py-1.5 rounded-full text-xs shrink-0" data-day="목">목요일</button>
      <button class="day-tab bg-indigo-600/70 text-white font-medium px-4 py-1.5 rounded-full text-xs shrink-0" data-day="금">금요일</button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-md mx-auto px-4 pt-4">

    <!-- Search & Filter Bar -->
    <div class="mb-3 flex gap-2">
      <div class="relative flex-1">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
        <input type="text" id="search-input" placeholder="수업명 또는 장소 검색..." class="w-full pl-9 pr-3 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm">
      </div>
      <select id="status-filter" class="bg-white border border-slate-200 text-sm rounded-xl px-2 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm">
        <option value="all">전체 상태</option>
        <option value="danger">⚠️ 이번 달 0회 (긴급)</option>
        <option value="pending">미완료만</option>
        <option value="done">완료만</option>
        <option value="optional">선택사항(기타)</option>
      </select>
    </div>

    <!-- Info Banner -->
    <div class="mb-3 text-[11px] text-slate-500 flex items-center justify-between px-1">
      <span><i class="fa-solid fa-arrow-down-short-wide text-indigo-500 mr-1"></i>시간순 ➔ 낮은 층수순 정렬됨</span>
      <span class="text-slate-400">(주 1회 촬영 / 월 최소 1회 필수)</span>
    </div>

    <!-- Cards Container -->
    <div id="cards-container" class="space-y-3"></div>
  </main>

  <!-- Hidden Upload Inputs -->
  <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden">
  <input type="file" id="gallery-input" accept="image/*" class="hidden">

  <!-- Modal 1: Photo Upload Type Selection Sheet -->
  <div id="upload-type-modal" class="fixed inset-0 bg-black/60 z-50 flex items-end justify-center hidden backdrop-blur-xs">
    <div class="bg-white rounded-t-3xl w-full max-w-md p-5 space-y-3">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-bold text-slate-800 text-base">사진 등록 방식 선택</h3>
        <button onclick="closeUploadTypeModal()" class="text-slate-400 text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="grid grid-cols-2 gap-3 pt-1">
        <button id="choose-camera-btn" class="py-4 bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 rounded-2xl flex flex-col items-center gap-2 text-indigo-700 font-bold transition">

          <span class="text-xs">갤러리/앨범에서 선택</span>

    </div>
  </div>

          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      
      <div class="p-4 space-y-3">

    function getFloorLevel(location) {
      if (location.includes("지하1층")) return -1;
      if (location.includes("서예실") || location.includes("1층")) return 1;
      if (location.includes("2층")) return 2;
      if (location.includes("3층")) return 3;
      return 99;
    }

    function getStartMinutes(timeStr) {
      const start = timeStr.split('~')[0].trim();
      const [h, m] = start.split(':').map(Number);
      return (h * 60) + (m || 0);
    }

    // 1일 기준 월/주차 계산 (예: 2026-9-W03)
    function getMonthWeekKey(d = new Date()) {
      const target = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      const year = target.getFullYear();
      const month = target.getMonth() + 1;
      
      const firstDayOfMonth = new Date(year, target.getMonth(), 1);
      const dayOfWeekOfFirst = firstDayOfMonth.getDay();
      
      const currentDate = target.getDate();
      let weekNum = Math.ceil((currentDate + (dayOfWeekOfFirst === 0 ? 6 : dayOfWeekOfFirst - 1)) / 7);

      return `${year}-${month}-W${String(weekNum).padStart(2, '0')}`;
    }

    function formatWeekTitle(weekKey) {
      if (!weekKey) return "주차 정보 없음";
      const parts = weekKey.split('-');
      if (parts.length < 3) return weekKey;
      const year = parts[0];
      const month = parseInt(parts[1], 10);
      const week = parseInt(parts[2].replace('W', ''), 10);
      return `${year}년 ${month}월 ${week}주차`;
    }

    // 📌 주차 Key와 수업 요일 기반 정확한 날짜 역산 (예: W01 + 금 ➔ 9.4)
    function calculateClassDateStr(weekKey, dayStr) {
      if (!weekKey || !weekKey.includes('-W')) {
        const now = new Date();
        return `${now.getMonth() + 1}.${now.getDate()}`;
      }

      const parts = weekKey.split('-');
      const year = parseInt(parts[0], 10);
      const month = parseInt(parts[1], 10);
      const weekNum = parseInt(parts[2].replace('W', ''), 10);

      const firstDay = new Date(year, month - 1, 1);
      let firstDayOfWeek = firstDay.getDay();
      if (firstDayOfWeek === 0) firstDayOfWeek = 7;

      const firstMondayDateNum = 1 - (firstDayOfWeek - 1);
      const targetMondayDateNum = firstMondayDateNum + (weekNum - 1) * 7;

      const dayMap = { "월": 0, "화": 1, "수": 2, "목": 3, "금": 4 };
      const addDays = dayMap[dayStr] !== undefined ? dayMap[dayStr] : 0;

      const targetDate = new Date(year, month - 1, targetMondayDateNum + addDays);

      return `${targetDate.getMonth() + 1}.${String(targetDate.getDate()).padStart(2, '0')}`;
    }

    // 📌 파일명 날짜(예: "9.4")를 기반으로 주차 Key 역계산
    function calculateWeekFromDateStr(dateStr) {
      if (!dateStr || !dateStr.includes('.')) return getMonthWeekKey();
      const [month, day] = dateStr.split('.').map(Number);
      const now = new Date();
      const targetDate = new Date(now.getFullYear(), month - 1, day);
      return getMonthWeekKey(targetDate);
    }

    let db;
    let isArchiveView = false;
    let currentViewingWeek = getMonthWeekKey();
    let remoteFileListCache = [];

    const dbRequest = indexedDB.open("TimetableAppDB_MultiWeek", 5);
    dbRequest.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains("photos")) db.createObjectStore("photos", { keyPath: "id" });
      if (!db.objectStoreNames.contains("archive_photos")) db.createObjectStore("archive_photos", { keyPath: "id" });
      if (!db.objectStoreNames.contains("meta")) db.createObjectStore("meta", { keyPath: "key" });
    };

    dbRequest.onsuccess = async (e) => {
      db = e.target.result;
      await checkAndAutoArchiveWeekly();
      await fetchRemoteDrivePhotos();
      populateWeekSelector();
      renderApp();
    };

    async function checkAndAutoArchiveWeekly() {
      const realCurrentWeekKey = getMonthWeekKey();
      const savedWeekObj = await getMetaDB("currentWeek");
      const savedWeek = savedWeekObj ? savedWeekObj.value : null;

      if (savedWeek && savedWeek !== realCurrentWeekKey) {
        const currentPhotos = await getAllDB("photos");
        for (const item of currentPhotos) {
          await putDB("archive_photos", { ...item, archiveWeek: savedWeek });
        }
        await clearDB("photos");
        await putDB("meta", { key: "currentWeek", value: realCurrentWeekKey });
        showToast(`🎉 새로운 주차(${formatWeekTitle(realCurrentWeekKey)})가 시작되었습니다.`);
      } else if (!savedWeek) {
        await putDB("meta", { key: "currentWeek", value: realCurrentWeekKey });
      }

      currentViewingWeek = realCurrentWeekKey;
      document.getElementById('current-week-badge').innerText = formatWeekTitle(realCurrentWeekKey);
    }

    async function fetchRemoteDrivePhotos() {
      try {
        showToast("구글 드라이브 최신 사진 동기화 중...");
        const res = await fetch(GAS_URL);
        if (!res.ok) throw new Error("서버 응답 오류");
        const fileList = await res.json();
        remoteFileListCache = Array.isArray(fileList) ? fileList : [];

        if (Array.isArray(fileList)) {
          const realCurrentWeekKey = getMonthWeekKey();

          for (const file of fileList) {
            const info = rawData.find(d => file.name.includes(d.name));
            if (info) {
              const pid = info.id;
              const driveImgUrl = `https://lh3.googleusercontent.com/d/${file.id}`;
              
              const nameDatePart = file.name.split('_')[0]; 
              const fileWeekKey = calculateWeekFromDateStr(nameDatePart);
              const dateStr = `${nameDatePart} (드라이브동기화)`;

              if (fileWeekKey === realCurrentWeekKey) {
                const existing = await getPhotoDB("photos", pid);
                if (!existing) {
                  await putDB("photos", { id: pid, dataUrl: driveImgUrl, dateStr, driveId: file.id, fileName: file.name, weekKey: fileWeekKey });
                }
              } else {
                const archiveId = `${fileWeekKey}_${pid}`;
                const existingArchive = await getPhotoDB("archive_photos", archiveId);
                if (!existingArchive) {
                  await putDB("archive_photos", { id: archiveId, originalId: pid, dataUrl: driveImgUrl, dateStr, driveId: file.id, fileName: file.name, archiveWeek: fileWeekKey });
                }
              }
            }
          }
        }
        showToast("동기화 완료!", false);
      } catch (err) {
        console.warn("드라이브 동기화 참고:", err);
      }
    }

    function populateWeekSelector() {
      const selector = document.getElementById('week-selector');
      selector.innerHTML = '';
      
      const now = new Date();
      const currentWeekKey = getMonthWeekKey(now);

      for (let w = 1; w <= 5; w++) {
        const key = `${now.getFullYear()}-${now.getMonth()+1}-W${String(w).padStart(2, '0')}`;
        weeks.push(key);

      weeks.forEach(wKey => {
        const opt = document.createElement('option');
        opt.value = wKey;
        opt.innerText = formatWeekTitle(wKey) + (wKey === currentWeekKey ? " (현재 이번 주)" : "");

    function showToast(msg, isLoading = true) {
      const toast = document.getElementById('toast');
      const icon = document.getElementById('toast-icon');

      text.innerText = msg;

      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2500);
    }

    function compressImageFile(file, maxWidth = 1280, quality = 0.75) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function getMetaDB(key) {
      return new Promise((resolve) => {
        const tx = db.transaction("meta", "readonly");
        const req = tx.objectStore("meta").get(key);
        req.onsuccess = () => resolve(req.result);
      });
    }

    function getPhotoDB(storeName, id) {
      return new Promise((resolve) => {
        const tx = db.transaction(storeName, "readonly");
        const req = tx.objectStore(storeName).get(id);
        req.onsuccess = () => resolve(req.result);
      });
    }

    function putDB(storeName, item) {
      return new Promise((resolve) => {
        const tx = db.transaction(storeName, "readwrite");
        tx.objectStore(storeName).put(item);
        tx.oncomplete = () => resolve();
      });
    }

    function getAllDB(storeName) {
      return new Promise((resolve) => {
        const tx = db.transaction(storeName, "readonly");
        const req = tx.objectStore(storeName).getAll();
        req.onsuccess = () => resolve(req.result || []);
      });
    }

    function deleteDB(storeName, id) {
      return new Promise((resolve) => {
        const tx = db.transaction(storeName, "readwrite");
        tx.objectStore(storeName).delete(id);
        tx.oncomplete = () => resolve();
      });
    }

    function clearDB(storeName) {
      return new Promise((resolve) => {
        const tx = db.transaction(storeName, "readwrite");
        tx.objectStore(storeName).clear();
        tx.oncomplete = () => resolve();
      });
    }

    let activeDay = "전체";
    let activeTargetId = null;

    async function renderApp() {
      const realCurrentWeekKey = getMonthWeekKey();
      isArchiveView = (currentViewingWeek !== realCurrentWeekKey);

      const activeStore = isArchiveView ? "archive_photos" : "photos";
      const photosList = await getAllDB(activeStore);

      const photoMap = new Map();
      photosList.forEach(item => {
        if (isArchiveView) {
          if (item.archiveWeek === currentViewingWeek) {
            photoMap.set(item.originalId || item.id, item);
          }
        } else {
          photoMap.set(item.id, item);
        }
      });

      const now = new Date();
      const currentMonthNum = now.getMonth() + 1;

      const monthlyCountMap = new Map();
      remoteFileListCache.forEach(file => {
        rawData.forEach(item => {
          if (file.name.includes(item.name)) {
            const count = monthlyCountMap.get(item.id) || 0;
            monthlyCountMap.set(item.id, count + 1);
          }
        });
      });

      const mandatoryItems = rawData.filter(d => !d.isOptional);
      const mandatoryTotal = mandatoryItems.length;
      const mandatoryCompleted = mandatoryItems.filter(d => photoMap.has(d.id)).length;
      const warningItems = mandatoryItems.filter(d => (monthlyCountMap.get(d.id) || 0) === 0);
      const warningCount = warningItems.length;

      const percent = Math.round((mandatoryCompleted / mandatoryTotal) * 100);

      document.getElementById('progress-text').innerText = `${isArchiveView ? '선택 주차' : '이번 주'} 필수 촬영: ${mandatoryCompleted} / ${mandatoryTotal} (${percent}%)`;
      document.getElementById('warning-count-badge').innerText = `이번 달 0회 미달선 ${warningCount}개`;
      document.getElementById('progress-bar').style.width = `${percent}%`;

      const banner = document.getElementById('archive-banner');
      if (isArchiveView) {
        banner.classList.remove('hidden');
        document.getElementById('archive-banner-text').innerText = `[${formatWeekTitle(currentViewingWeek)} 보관함]을 조회 중입니다.`;
      } else {
        banner.classList.add('hidden');
      }

      const searchTerm = document.getElementById('search-input').value.trim().toLowerCase();
      const statusFilter = document.getElementById('status-filter').value;

      let filtered = rawData.filter(item => {
        const matchDay = (activeDay === "전체" || item.day === activeDay);
        const matchSearch = item.name.toLowerCase().includes(searchTerm) || item.location.toLowerCase().includes(searchTerm);
        const isDone = photoMap.has(item.id);
        const monthUploads = monthlyCountMap.get(item.id) || 0;
        
        let matchStatus = true;
        if (statusFilter === "danger") {
          matchStatus = !item.isOptional && monthUploads === 0;
        } else if (statusFilter === "pending") {
          matchStatus = !isDone && !item.isOptional;
        } else if (statusFilter === "done") {
          matchStatus = isDone;
        } else if (statusFilter === "optional") {
          matchStatus = item.isOptional;
        }

        return matchDay && matchSearch && matchStatus;
      });

      filtered.sort((a, b) => {
        const timeA = getStartMinutes(a.time);
        const timeB = getStartMinutes(b.time);
        if (timeA !== timeB) return timeA - timeB;

        const floorA = getFloorLevel(a.location);
        const floorB = getFloorLevel(b.location);
        if (floorA !== floorB) return floorA - floorB;

        return a.location.localeCompare(b.location);
      });

      const container = document.getElementById('cards-container');
      container.innerHTML = '';

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-2xl p-8 text-center text-slate-400">
            <i class="fa-solid fa-folder-open text-4xl mb-2 text-slate-300"></i>
            <p class="text-sm">조건에 맞는 수업이 없습니다.</p>
          </div>
        `;
        return;
      }

      filtered.forEach(item => {
        const photoData = photoMap.get(item.id);
        const isCompleted = !!photoData;
        const monthCount = monthlyCountMap.get(item.id) || 0;
        const isDanger = !item.isOptional && monthCount === 0;

        const card = document.createElement('div');
        card.className = `bg-white rounded-2xl p-4 shadow-sm border transition-all ${
          isDanger 
            ? 'border-rose-400 bg-rose-50/30' 
            : (isCompleted ? 'border-emerald-300 bg-emerald-50/20' : (item.isOptional ? 'border-slate-200 bg-slate-50/40' : 'border-slate-200'))
        }`;

        card.innerHTML = `
          <div class="flex items-start justify-between gap-2 mb-2">
            <div>
              <div class="flex items-center gap-1.5 mb-1 flex-wrap">
                <span class="bg-indigo-100 text-indigo-700 font-bold px-2 py-0.5 rounded text-xs">${item.day}요일</span>
                <span class="bg-slate-100 text-slate-700 font-bold px-2 py-0.5 rounded text-xs font-mono"><i class="fa-regular fa-clock text-indigo-500 mr-1"></i>${item.time}</span>
                ${item.isOptional ? `<span class="bg-slate-200 text-slate-600 px-1.5 py-0.2 rounded text-[10px] font-semibold">선택(기타)</span>` : ''}
                
                <span class="px-2 py-0.2 rounded text-[10px] font-bold ${isDanger ? 'bg-rose-600 text-white animate-pulse' : 'bg-slate-200 text-slate-700'}">
                  ${currentMonthNum}월 촬영: ${monthCount}회
                </span>
              </div>
              <h3 class="font-bold text-slate-800 text-base leading-snug flex items-center gap-1">
                ${isDanger ? `<i class="fa-solid fa-triangle-exclamation text-rose-500 text-sm"></i>` : ''}
                ${item.name}
              </h3>
              <p class="text-xs text-slate-500 flex items-center gap-1 mt-0.5">
                <i class="fa-solid fa-location-dot text-indigo-400"></i> ${item.location}
              </p>
            </div>
            <div>
              ${isCompleted 
                ? `<span class="inline-flex items-center gap-1 bg-emerald-100 text-emerald-700 px-2.5 py-1 rounded-full text-xs font-bold shrink-0"><i class="fa-solid fa-circle-check"></i> 완료</span>`
                : (item.isOptional 
                    ? `<span class="inline-flex items-center gap-1 bg-slate-100 text-slate-400 px-2.5 py-1 rounded-full text-xs shrink-0"><i class="fa-solid fa-circle-minus"></i> 선택사항</span>`
                    : (isDanger 
                        ? `<span class="inline-flex items-center gap-1 bg-rose-100 text-rose-700 border border-rose-300 px-2.5 py-1 rounded-full text-xs font-bold shrink-0"><i class="fa-solid fa-triangle-exclamation"></i> 0회(필수등록)</span>`

            </div>
          </div>

          ${isCompleted ? `
            <div class="mt-3 relative rounded-xl overflow-hidden border border-slate-300 bg-slate-900 aspect-video group cursor-pointer shadow-inner" onclick="openPhotoModal('${item.id}')">
              <img src="${photoData.dataUrl}" alt="${item.name}" class="w-full h-full object-cover">
              
              <div class="absolute inset-0 bg-black/30 group-hover:bg-black/40 transition flex flex-col justify-between p-3 text-white">

            </button>
          `}
        `;
        container.appendChild(card);
      });

      document.getElementById('week-selector').value = currentViewingWeek;

    async function openPhotoModal(id) {
      const activeStore = isArchiveView ? "archive_photos" : "photos";
      const photos = await getAllDB(activeStore);
      const photoData = photos.find(p => isArchiveView ? (p.originalId === id || p.id === `${currentViewingWeek}_${id}`) : p.id === id);
      const itemInfo = rawData.find(r => r.id === id);

      if (!photoData || !itemInfo) return;

      document.getElementById('modal-title').innerText = `[${itemInfo.day}요일 ${itemInfo.location}] ${itemInfo.name}`;
      document.getElementById('modal-date').innerText = `촬영 및 동기화: ${photoData.dateStr}`;
      document.getElementById('modal-img').src = photoData.dataUrl;

      const retakeBtn = document.getElementById('modal-retake-btn');
      const deleteBtn = document.getElementById('modal-delete-btn');

      retakeBtn.style.display = 'flex';
      deleteBtn.style.display = 'flex';

      retakeBtn.onclick = () => {
        closePhotoModal();
        openUploadTypeModal(id);
      };

      deleteBtn.onclick = async () => {
        if (confirm('구글 드라이브 및 스마트폰에서 이 사진을 완전 삭제하시겠습니까?')) {
          showToast("구글 드라이브 사진 삭제 중...");
          try {
            await fetch(GAS_URL, {
              method: 'POST',
              body: JSON.stringify({ action: "delete", targetKey: itemInfo.name })
            });
          } catch (err) {
            console.warn("드라이브 삭제 처리 중:", err);
          }
          if (isArchiveView) {
            const archiveId = photoData.id;
            await deleteDB("archive_photos", archiveId);
          } else {
            await deleteDB("photos", id);
          }
          closePhotoModal();
          showToast("삭제 완료", false);
          await fetchRemoteDrivePhotos();
          renderApp();
        }
      };

      document.getElementById('photo-modal').classList.remove('hidden');
    }

    function closePhotoModal() {
      document.getElementById('photo-modal').classList.add('hidden');
    }

    document.getElementById('modal-close-btn').addEventListener('click', closePhotoModal);

    function openUploadTypeModal(id) {
      activeTargetId = id;
      document.getElementById('upload-type-modal').classList.remove('hidden');
    }

    function closeUploadTypeModal() {
      document.getElementById('upload-type-modal').classList.add('hidden');
    }

    document.getElementById('choose-camera-btn').addEventListener('click', () => {
      closeUploadTypeModal();
      setTimeout(() => {
        const input = document.getElementById('camera-input');
        input.value = "";
        input.click();
      }, 50);
    });

    document.getElementById('choose-gallery-btn').addEventListener('click', () => {
      closeUploadTypeModal();
      setTimeout(() => {
        const input = document.getElementById('gallery-input');
        input.value = "";
        input.click();
      }, 50);
    });

    async function handleFileSelected(file) {
      if (!file || !activeTargetId) return;
      const info = rawData.find(r => r.id === activeTargetId);
      if (!info) return;

      showToast("이미지 고화질 압축 중...");
      const compressedDataUrl = await compressImageFile(file);
      
      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      
      // 📌 선택 주차(1주차 등) + 수업 요일(금) 기반 역산 날짜 (9.4)
      const calculatedDateStr = calculateClassDateStr(currentViewingWeek, info.day);
      const fileName = `${calculatedDateStr}_${info.name}.jpg`;
      const dateStr = `${calculatedDateStr} ${timeStr}`;

      if (isArchiveView) {
        const archiveId = `${currentViewingWeek}_${activeTargetId}`;
        await putDB("archive_photos", {
          id: archiveId,
          originalId: activeTargetId,
          dataUrl: compressedDataUrl,
          dateStr,
          fileName,
          archiveWeek: currentViewingWeek
        });
      } else {
        await putDB("photos", { id: activeTargetId, dataUrl: compressedDataUrl, dateStr, fileName, weekKey: getMonthWeekKey() });
      }
      renderApp();

      showToast("구글 드라이브 초고속 전송 중...");

      try {
        await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ fileName: fileName, programName: info.name, dataUrl: compressedDataUrl })
        });
        showToast("드라이브 저장 완료!", false);
      } catch (err) {
        console.warn("드라이브 전송 완료:", err);
      } finally {
        await fetchRemoteDrivePhotos();
        renderApp();
      }

      activeTargetId = null;
    }

    document.getElementById('camera-input').addEventListener('change', function(e) {
      handleFileSelected(e.target.files[0]);
      e.target.value = "";
    });

    document.getElementById('gallery-input').addEventListener('change', function(e) {
      handleFileSelected(e.target.files[0]);
      e.target.value = "";
    });

    document.getElementById('open-menu-btn').addEventListener('click', () => {
      document.getElementById('menu-modal').classList.remove('hidden');
    });

    document.getElementById('menu-close-btn').addEventListener('click', () => {
      document.getElementById('menu-modal').classList.add('hidden');
    });

    document.getElementById('load-week-btn').addEventListener('click', () => {
      const selectedWeek = document.getElementById('week-selector').value;
      currentViewingWeek = selectedWeek;
      document.getElementById('menu-modal').classList.add('hidden');
      renderApp();
    });

    document.getElementById('menu-sync-btn').addEventListener('click', async () => {
      document.getElementById('menu-modal').classList.add('hidden');
      await fetchRemoteDrivePhotos();
      renderApp();
    });

    document.getElementById('menu-reset-btn').addEventListener('click', async () => {
      document.getElementById('menu-modal').classList.add('hidden');
      if (isArchiveView) {
        alert('보관함 모드에서는 초기화 기능을 사용할 수 없습니다. 개별 사진 삭제를 이용해 주세요.');
        return;
      }
      if (confirm('이번 주 찍은 사진들을 모두 삭제하고 초기화하시겠습니까?')) {
        await clearDB("photos");
        renderApp();
        showToast("초기화 완료", false);
      }
    });

    document.querySelectorAll('.day-tab').forEach(tab => {
      tab.addEventListener('click', (e) => {
        document.querySelectorAll('.day-tab').forEach(t => {
          t.className = "day-tab bg-indigo-600/70 text-white font-medium px-4 py-1.5 rounded-full text-xs shrink-0";
        });
        e.target.className = "day-tab active-tab bg-white text-indigo-700 font-bold px-4 py-1.5 rounded-full text-xs shadow shrink-0";
        activeDay = e.target.dataset.day;
        renderApp();
      });
    });

    document.getElementById('search-input').addEventListener('input', renderApp);
    document.getElementById('status-filter').addEventListener('change', renderApp);

    document.getElementById('menu-download-btn').addEventListener('click', async () => {
      document.getElementById('menu-modal').classList.add('hidden');
      const activeStore = isArchiveView ? "archive_photos" : "photos";
      const photos = await getAllDB(activeStore);
      
      const filteredPhotos = photos.filter(item => isArchiveView ? item.archiveWeek === currentViewingWeek : true);

      if (filteredPhotos.length === 0) {
        alert('다운로드할 사진이 없습니다!');
        return;
      }

      showToast("ZIP 압축 생성 중...");
      const zip = new JSZip();
      const folderName = `${formatWeekTitle(currentViewingWeek)}_수업사진`;
      const folder = zip.folder(folderName);

      for (const item of filteredPhotos) {
        const info = rawData.find(d => d.id === (item.originalId || item.id));
        if (info) {
          const fileName = item.fileName || `${info.name}.jpg`;
          
          if (item.dataUrl.startsWith("data:image")) {
            const base64Data = item.dataUrl.split(',')[1];
            folder.file(fileName, base64Data, { base64: true });
          } else {
            try {
              const imgRes = await fetch(item.dataUrl);
              const blob = await imgRes.blob();
              folder.file(fileName, blob);
            } catch (err) {
              console.warn("ZIP 변환 참고:", fileName);
            }
          }
        }
      }

      const content = await zip.generateAsync({ type: "blob" });
      const zipFileName = `장수대학_${formatWeekTitle(currentViewingWeek)}_사진.zip`;

      saveAs(content, zipFileName);
      showToast("ZIP 다운로드 시작!", false);
    });
  </script>
</body>
</html>
